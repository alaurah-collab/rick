<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personajes de Rick and Morty</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

    <div class="container py-4">
        <h1 class="text-center fw-bold mb-4">Personajes de Rick and Morty</h1>

        <div id="mensaje-error" class="alert alert-danger d-none text-center" role="alert"></div>

        <div id="grid-personajes" class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4"></div>

        <div class="d-flex justify-content-center align-items-center gap-3 my-5">
            <button id="btn-anterior" class="btn btn-success" disabled>« Anterior</button>
            <span id="texto-pagina" class="fw-semibold">Página 1 de 42</span>
            <button id="btn-siguiente" class="btn btn-primary">Siguiente »</button>
        </div>
    </div>

    <div class="modal fade" id="modalDetalle" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content bg-dark border-secondary">
                <div class="modal-header border-success">
                    <h4 class="modal-title fw-bold" id="modal-titulo">Personaje</h4>
                    
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    
                </div>
                <div class="modal-body" id="modal-cuerpo"></div>
                <div class="modal-footer border-success">
                    <button type="button" class="btn btn-success" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
